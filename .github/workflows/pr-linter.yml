# This workflow will run eslint and prettier checks on pull requests to ensure code quality and consistency

name: PR Linter

on:
    pull_request:
        branches:
            - master

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Install Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "18"
            - name: Install dependencies
              run: npm install
            - name: Run ESLint
              run: npm run lint
            - name: Run Prettier
              run: npm run prettier:check
